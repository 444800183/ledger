<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销售流水与结算</title>
<meta name="theme-color" content="#0b6b5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="销售流水">
<meta name="description" content="销售流水开单、结算与对账工具">
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1c1f24; --ink2:#5c6470; --ink3:#8d95a1;
  --line:#e6e8ec; --brand:#0b6b5a; --brand-soft:#e6f2ef;
  --sale:#0b6b5a; --cost:#b06a00; --exp:#b3261e; --profit:#0b6b5a; --loss:#b3261e;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; font-size:13.5px; line-height:1.5; padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{margin:0;font-weight:650}
.wrap{max-width:960px;margin:0 auto;padding:14px 14px 24px}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.topbar h1{font-size:19px}.topbar .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card>h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card>h3 .hint{font-size:12px;color:var(--ink3);font-weight:400}
.row{display:flex;gap:10px}.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.view{display:none}.view.on{display:block}
.muted{color:var(--ink2)}.small{font-size:12px}.pos{color:var(--profit)}.neg{color:var(--loss)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12px;color:var(--ink2);font-weight:600}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{min-height:64px;resize:vertical}
.btn{min-height:44px;padding:10px 16px;border-radius:10px;background:var(--brand);color:#fff;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:#fdecea;color:var(--exp)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.chip{min-height:36px;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2);font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{display:flex;background:#eceef1;border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:13px;color:var(--ink2);font-weight:600;display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 8px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:11px;padding:6px 0}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar button.on{color:var(--brand);font-weight:650}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
table.grid th{position:sticky;top:0;z-index:4;background:#2E7D56;color:#fff;font-weight:500;font-size:12px;padding:9px 2px;text-align:center;white-space:nowrap;border-right:1px solid #246344}
table.grid th:last-child{border-right:none}
table.grid td{padding:0;height:44px;background:#fff;border-bottom:1px solid #f0f0f0;vertical-align:middle}
table.grid td.seq{background:#2E7D56;color:#fff;text-align:center;font-size:12px;font-weight:700;border-right:1px solid #246344}
table.grid td.col-amount{background:#F1F8E9}
table.grid td.col-del{text-align:center}
table.grid td input{width:100%;min-height:44px;height:44px;padding:0 8px;border:none;background:transparent;font-size:13px;text-align:left;outline:none;color:#333}
table.grid td input.n{text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
table.grid td input:focus{background:#FFF8E1;box-shadow:inset 0 0 0 2px #2E7D56}
table.grid td input::placeholder{color:#c8ced6}
table.grid tr.input-row td{background:#fffbe6}
table.grid tr.input-row td.seq{background:#c9a227}
table.grid tr.input-row td.col-amount{background:#fdf3d0}
table.grid td.col-del button.cellbtn{width:22px;height:22px;min-height:22px;line-height:20px;border-radius:50%;background:#f0f0f0;color:#999;font-size:11px;margin:0 auto;padding:0}
.paidbtn{width:100%;height:44px;font-size:12px;font-weight:700;color:#b3261e;background:#fdecea;padding:0}
.paidbtn.on{color:#0b6b5a;background:#e6f2ef}
.savebtn{width:100%;height:44px;font-size:18px;font-weight:700;color:#fff;background:#2E7D56;padding:0}
.savebtn:active{background:#256746}
.gridhint{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.6}
.entry-table-scroll{max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px 10px 0 0;background:#fff;}
.entry-table-scroll table.grid{border-radius:0}
.entry-table-fixed{border:1px solid var(--line);border-top:2px solid #2E7D56;border-radius:0 0 10px 10px;overflow:hidden;background:#fff;}
.quickpick{display:none;flex-wrap:wrap;gap:6px;padding:10px 2px 0}
.quickpick.on{display:flex}.quickpick .qp-label{width:100%;font-size:11px;color:var(--ink3);margin-bottom:-2px}
.chip.sm{min-height:30px;padding:5px 11px;font-size:12.5px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th,table.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl th{font-size:12px;color:var(--ink3);background:#fafbfc;font-weight:650;white-space:nowrap}
table.tbl tr.total td{font-weight:750;border-top:2px solid var(--ink);background:#fafbfc}
.sumbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.sumbar .sc{background:#f7f9f8;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.sumbar .sc .k{font-size:11px;color:var(--ink3)}
.sumbar .sc .v{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.sumbar .sc .v.pos{color:var(--profit)}.sumbar .sc .v.neg{color:var(--loss)}
@media (max-width:520px){.sumbar{grid-template-columns:repeat(2,1fr)}}
.warn{background:#fdecea;border:1px solid #f7c8c2;border-radius:10px;padding:10px 12px;margin-top:10px;color:#b3261e;font-size:13px;display:flex;align-items:center;gap:8px}
.warn .ic{font-size:16px}.warn b{font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:650;line-height:1.6;white-space:nowrap}
.tag.wait{background:#fdecea;color:#b3261e}.tag.done{background:var(--brand-soft);color:var(--sale)}.tag.calc{background:#fdf3e3;color:var(--cost)}
.bill{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.bill .bh{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.bill .bh h2{font-size:20px;letter-spacing:4px}.bill .bh .n{font-size:12px;color:var(--ink3);margin-top:5px}
.bill .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;margin-bottom:12px}
.bill .meta div{display:flex;gap:6px}.bill .meta span:first-child{color:var(--ink3);flex:none}.bill .meta span:last-child{font-weight:600;word-break:break-all}
.bill .sign{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:13px;color:var(--ink2)}
.bill .sign div{flex:1}.bill .sign .line{border-bottom:1px solid var(--ink3);height:26px;margin-bottom:5px}
.bill .note{margin-top:14px;font-size:12px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:10px;white-space:pre-wrap}
.bigtotal{background:var(--brand-soft);border-radius:10px;padding:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bigtotal .k{font-size:13px;color:var(--brand);font-weight:650}.bigtotal .v{font-size:24px;font-weight:750;color:var(--brand);font-variant-numeric:tabular-nums}
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(28,31,36,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;padding:34px 16px;color:var(--ink3)}.empty .big{font-size:34px;margin-bottom:10px;opacity:.55}.empty p{margin:0 0 4px;font-size:13.5px}
.hero{background:linear-gradient(135deg,#0b6b5a,#12876f);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .k{font-size:12px;opacity:.82}.hero .v{font-size:28px;font-weight:750;letter-spacing:.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .split{display:flex;gap:18px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22)}.hero .split div{flex:1}.hero .split .n{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--ink3)}.stat .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}.stat .u{font-size:12px;color:var(--ink3);font-weight:500;margin-left:2px}
.rank .rk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.rank .rk:last-child{border-bottom:none}
.rank .rk .idx{width:22px;height:22px;border-radius:7px;background:#eef0f3;color:var(--ink2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.rank .rk .nm{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rk .track{height:6px;background:#eef0f3;border-radius:3px;overflow:hidden;margin-top:5px}.rank .rk .track i{display:block;height:100%;background:var(--brand);border-radius:3px}
.rank .rk .val{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}.rank .rk .val small{display:block;font-size:11px;color:var(--ink3);font-weight:500}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}.mask{align-items:center;padding:20px}.sheet{border-radius:18px;max-width:560px}.bill{padding:26px}}
html,body{overscroll-behavior:none;touch-action:manipulation}.entry-table-scroll,.sheet{-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div style="flex:1">
      <h1 id="shopTitle">销售流水</h1>
      <div class="sub" id="shopSub">开单 · 结算 · 对账</div>
    </div>
  </div>
  <section class="view on" id="view-entry"></section>
  <section class="view" id="view-settle"></section>
  <section class="view" id="view-detail"></section>
  <section class="view" id="view-bill"></section>
  <section class="view" id="view-stats"></section>
  <section class="view" id="view-settings"></section>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
var IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
var KEY='xs_v5';
var state={settings:null,records:[]};
function defaultSettings(){ return {shopName:'',phone:'',addr:'',billTitle:'对账单',billNote:'',money:'元',unit:'吨',costPrice:0}; }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var d=JSON.parse(raw); state.settings=Object.assign(defaultSettings(),d.settings||{}); state.records=Array.isArray(d.records)?d.records:[]; }
    else{ state.settings=defaultSettings(); }
  }catch(e){ state.settings=defaultSettings(); state.records=[]; }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ toast('保存失败：存储空间不足'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function el(tag,cls,txt){ var n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; }
function add(p){ for(var i=1;i<arguments.length;i++){ if(arguments[i]!=null)p.appendChild(arguments[i]); } return p; }
function q(s,r){ return (r||document).querySelector(s); }
function qa(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function fmt(n,dec){ var d=(dec==null?2:dec); var s=(Math.round(num(n)*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); var parts=s.split('.'); parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return parts.join('.'); }
function fmtMoney(n){ return fmt(n,2); }
function fmtQty(n){ var v=num(n); return (Math.round(v*1000)/1000).toString(); }
function today(){ return dstr(new Date()); }
function dstr(d){ var m=d.getMonth()+1,day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(day<10?'0'+day:day); }
function addDays(ds,n){ var d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return dstr(d); }
function weekday(ds){ return '周'+'日一二三四五六'.charAt(new Date(ds+'T00:00:00').getDay()); }
function prettyDate(ds){ var t=today(); if(ds===t) return '今天'; if(ds===addDays(t,-1)) return '昨天'; return ds.slice(5).replace('-','/')+' '+weekday(ds); }
function toast(msg){ var t=q('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2200); }
function L(){ return state.settings; }
function download(name,text,mime){
  if(IS_APP){ showBackupText(text); return; }
  var blob=new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'}); var url=URL.createObjectURL(blob); var a=el('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); },300);
}
function showBackupText(text){
  var box=el('div','stack'); var ta=el('textarea','inp'); ta.value=text; ta.style.cssText='min-height:220px;font-size:11px;font-family:monospace;line-height:1.4'; ta.readOnly=true;
  box.appendChild(el('p','small muted','长按全选复制，粘贴到备忘录或微信文件传输助手保存。')); box.appendChild(ta);
  var b=el('button','btn block','复制全部'); b.type='button'; b.addEventListener('click',function(){ ta.select(); copyText(text,'备份已复制，请粘贴保存'); }); box.appendChild(b); openSheet('导出备份',box);
}
function copyText(text,okMsg){
  function fallback(){ var ta=el('textarea'); ta.value=text; ta.style.cssText='position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; } document.body.removeChild(ta); toast(ok?(okMsg||'已复制'):'复制失败，请长按手动复制'); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast(okMsg||'已复制'); },fallback); }else fallback();
}
function input(id,type,val,ph){ var i=el('input','inp'); if(id) i.id=id; i.type=type||'text'; if(val!=null&&val!=='') i.value=val; if(ph) i.placeholder=ph; return i; }
function tin(type,val,ph,cls){ var i=el('input'); i.type=type||'text'; if(val!=null&&val!=='') i.value=val; if(ph) i.placeholder=ph; if(cls) i.className=cls; return i; }
function field(labelText,control,hint){ var f=el('div','field'); f.appendChild(el('label',null,labelText)); f.appendChild(control); if(hint) f.appendChild(el('div','small muted',hint)); return f; }
function statBox(k,v,u,cls){ var b=el('div','stat'); b.appendChild(el('div','k',k)); var val=el('div','v '+(cls||'')); val.appendChild(document.createTextNode(v)); if(u) val.appendChild(el('span','u',u)); b.appendChild(val); return b; }
function recsOf(date){ return state.records.filter(function(r){ return r.date===date; }); }
function rangeRecs(from,to){ return state.records.filter(function(r){ return (!from||r.date>=from)&&(!to||r.date<=to); }); }
function sumQty(rs){ var s=0; rs.forEach(function(r){ s+=num(r.qty); }); return s; }
function sumAmt(rs){ var s=0; rs.forEach(function(r){ s+=num(r.amount); }); return s; }
function sumUnpaid(rs){ var s=0; rs.forEach(function(r){ if(!r.paid) s+=num(r.finalAmount!=null?r.finalAmount:r.amount); }); return s; }
function countUnpaid(rs){ var n=0; rs.forEach(function(r){ if(!r.paid) n++; }); return n; }
function allCustomers(){ var arr=[]; state.records.forEach(function(r){ var c=(r.customer||'').trim(); if(c && arr.indexOf(c)<0) arr.push(c); }); return arr; }

/* === 核心业务逻辑 === */
function getCostPrice(r){ return r.costPrice != null ? num(r.costPrice) : num(L().costPrice); }
// 成本 = 装车吨位 × 成本单价
function rCost(r){ return num(r.qty) * getCostPrice(r); }
// 售价 = 卸车吨位 × 结算单价（若填了结清金额，以结清金额为准）
function getFinalAmount(r){
  if(r.finalAmount != null && r.finalAmount !== '') return num(r.finalAmount);
  var qty = r.unloadQty != null ? num(r.unloadQty) : num(r.qty);
  var price = r.settlePrice != null ? num(r.settlePrice) : num(r.price);
  return qty * price;
}
// 利润 = 售价 - 成本
function rProfit(r){ return getFinalAmount(r) - rCost(r); }
// 亏吨 = 装车吨位 - 卸车吨位（未填卸车吨位时，亏吨为0）
function getLoss(r){
  if(r.unloadQty == null) return 0;
  return num(r.qty) - num(r.unloadQty);
}
function isSettled(r){ return r.unloadQty != null || r.settlePrice != null || r.finalAmount != null || r.costPrice != null; }
/* ========================================= */

function openSheet(title,node,onClose){
  var sheet=q('#sheet'); sheet.textContent=''; var h=el('h3'); add(h,el('span',null,title));
  var x=el('button'); x.type='button'; x.setAttribute('aria-label','关闭'); x.style.cssText='width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8d95a1';
  x.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  x.addEventListener('click',closeSheet); h.appendChild(x); add(sheet,h,node); q('#mask').classList.add('on'); openSheet._cb=onClose||null;
}
function closeSheet(){ q('#mask').classList.remove('on'); if(openSheet._cb){ var c=openSheet._cb; openSheet._cb=null; c(); } }
q('#mask').addEventListener('click',function(e){ if(e.target===q('#mask')) closeSheet(); });
function confirmDialog(title,desc,okLabel,onOk){
  var box=el('div','stack'); if(desc) box.appendChild(el('p','muted small',null)).textContent=desc;
  var row=el('div','row'); var c=el('button','btn ghost','取消'); c.type='button'; c.style.flex='1'; c.addEventListener('click',closeSheet);

/* ========== 云同步 ========== */
var CLOUD_KEY='xs_cloud_v1';
function loadCloud(){ try{ return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}'); }catch(e){ return {}; } }
function saveCloudCfg(user,pass,file,proxy){ var c=loadCloud(); c.user=(user||'').trim(); c.pass=(pass||'').trim(); c.file=(file||'').trim()||'账本.json'; c.proxy=(proxy||'').trim(); try{ localStorage.setItem(CLOUD_KEY,JSON.stringify(c)); }catch(e){} }
function davAuth(u,p){ var s=u+':'+p; return 'Basic '+btoa(unescape(encodeURIComponent(s))); }
function davURL(c){ var base='https://dav.jianguoyun.com/dav/'; var file=encodeURIComponent(c.file||'账本.json'); var url=base+file; var proxy=c.proxy||''; if(!proxy) return url; if(proxy.indexOf('{url}')>=0) return proxy.replace('{url}',encodeURIComponent(url)); return proxy+encodeURIComponent(url); }
async function davGet(c){ var resp=await fetch(davURL(c),{ method:'GET', headers:{'Authorization':davAuth(c.user,c.pass)} }); if(resp.status===404) return null; if(!resp.ok) throw new Error('下载失败 HTTP '+resp.status); return await resp.json(); }
async function davPut(c,data){ var resp=await fetch(davURL(c),{ method:'PUT', headers:{ 'Authorization':davAuth(c.user,c.pass), 'Content-Type':'application/json;charset=utf-8' }, body:JSON.stringify(data) }); if(!resp.ok && resp.status!==201 && resp.status!==204){ throw new Error('上传失败 HTTP '+resp.status); } return true; }
function mergeState(local,remote){
  if(!remote||!Array.isArray(remote.records)) return {settings:local.settings,records:local.records};
  var map={}; (local.records||[]).forEach(function(r){ map[r.id]=r; });
  (remote.records||[]).forEach(function(r){ if(!map[r.id] || (r.ts||0)>(map[r.id].ts||0)) map[r.id]=r; });
  var merged=Object.keys(map).map(function(k){ return map[k]; }); merged.sort(function(a,b){ return (a.date<b.date)?-1:(a.date>b.date?1:(a.ts||0)-(b.ts||0)); });
  return { settings: Object.assign({}, remote.settings||{}, local.settings||{}), records: merged };
}
