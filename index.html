<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>销售流水与结算</title>
<meta name="theme-color" content="#0b6b5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="销售流水">
<meta name="description" content="销售流水开单、结算与对账工具">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1c1f24;--ink2:#5c6470;--ink3:#8d95a1;--line:#eaecf0;--line2:#f4f5f7;--brand:#0b6b5a;--brand-soft:#e6f2ef;--brand-deep:#095448;--exp:#b3261e;--radius:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3{margin:0;font-weight:650}
.wrap{max-width:960px;margin:0 auto;padding:10px 14px 24px}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
.topbar .brandMark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0b6b5a,#12876f);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none;box-shadow:0 3px 8px rgba(11,107,90,.28)}
.topbar h1{font-size:18px}
.topbar .sub{font-size:11.5px;color:var(--ink3);margin-top:0}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card>h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card>h3 .hint{font-size:11.5px;color:var(--ink3);font-weight:400}
.row{display:flex;gap:10px}.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.view{display:none}.view.on{display:block}
.muted{color:var(--ink2)}.small{font-size:12px}
.pos{color:#0b6b5a}.neg{color:#b3261e}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:12px;color:var(--ink2);font-weight:600}
.inp{width:100%;min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{min-height:60px;resize:vertical}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;background:var(--brand);color:#fff;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{filter:brightness(.94)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-deep)}
.btn.danger{background:#fdecea;color:var(--exp)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.chip{min-height:36px;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2);font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.sm{min-height:30px;padding:5px 11px;font-size:12.5px}
.seg{display:flex;background:#eef0f3;border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:13px;color:var(--ink2);font-weight:600;display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 10px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:10.5px;padding:6px 0;font-weight:500}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--brand);font-weight:650}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
table.grid th{position:sticky;top:0;z-index:4;background:#2E7D56;color:#fff;font-weight:500;font-size:12px;padding:9px 2px;text-align:center;white-space:nowrap;border-right:1px solid #246344}
table.grid th:last-child{border-right:none}
table.grid td{padding:0;height:44px;background:#fff;border-bottom:1px solid #f0f0f0;vertical-align:middle}
table.grid td.seq{background:#2E7D56;color:#fff;text-align:center;font-size:12px;font-weight:700;border-right:1px solid #246344}
table.grid td.col-amount{background:#F1F8E9}
table.grid td.col-del{text-align:center}
table.grid td input{width:100%;min-height:44px;height:44px;padding:0 8px;border:none;background:transparent;font-size:13px;text-align:left;outline:none;color:#333}
table.grid td input.n{text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
table.grid td input:focus{background:#FFF8E1;box-shadow:inset 0 0 0 2px #2E7D56}
table.grid td input::placeholder{color:#c8ced6}
table.grid tr.input-row td{background:#fffbe6}
table.grid tr.input-row td.seq{background:#c9a227}
table.grid tr.input-row td.col-amount{background:#fdf3d0}
table.grid td.col-del button.cellbtn{width:22px;height:22px;min-height:22px;line-height:20px;border-radius:50%;background:#f0f0f0;color:#999;font-size:11px;margin:0 auto;padding:0}
.paidbtn{width:100%;height:44px;font-size:12px;font-weight:700;color:#b3261e;background:#fdecea;padding:0}
.paidbtn.on{color:#0b6b5a;background:#e6f2ef}
.savebtn{width:100%;height:44px;font-size:17px;font-weight:700;color:#fff;background:#2E7D56;padding:0}
.gridhint{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
.entry-table-scroll{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px 12px 0 0;background:#fff}
.entry-table-scroll table.grid{border-radius:0}
.entry-table-fixed{border:1px solid var(--line);border-top:2px solid #2E7D56;border-radius:0 0 12px 12px;overflow:hidden;background:#fff}
.quickpick{display:none;flex-wrap:wrap;gap:6px;padding:10px 2px 0}
.quickpick.on{display:flex}
.quickpick .qp-label{width:100%;font-size:10.5px;color:var(--ink3);margin-bottom:-2px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th,table.tbl td{padding:8px 6px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl th{font-size:11.5px;color:var(--ink3);background:#fafbfc;font-weight:650;white-space:nowrap}
table.tbl tr.total td{font-weight:750;border-top:2px solid var(--ink);background:#fafbfc}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl tbody tr.clickable:active{background:#f8faf9}
.sumbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.sumbar .sc{background:#f7f9f8;border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center}
.sumbar .sc .k{font-size:10.5px;color:var(--ink3)}
.sumbar .sc .v{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.sumbar .sc .v.pos{color:#0b6b5a}.sumbar .sc .v.neg{color:#b3261e}
@media (max-width:520px){.sumbar{grid-template-columns:repeat(2,1fr)}}
.warn{background:#fef3f2;border:1px solid #fbcdc7;border-radius:12px;padding:9px 12px;margin-top:10px;color:#a11b15;font-size:12.5px;display:flex;align-items:center;gap:8px}
.warn .ic{font-size:15px}
.warn b{font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:650;line-height:1.6;white-space:nowrap}
.tag.wait{background:#fdecea;color:#b3261e}.tag.done{background:var(--brand-soft);color:#0b6b5a}.tag.part{background:#fff8e1;color:#b06a00}
.bill{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.bill .bh{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.bill .bh h2{font-size:18px;letter-spacing:3px}
.bill .bh .n{font-size:11.5px;color:var(--ink3);margin-top:5px}
.bill .meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:12.5px;margin-bottom:10px}
.bill .meta div{display:flex;gap:6px}
.bill .meta span:first-child{color:var(--ink3);flex:none}
.bill .meta span:last-child{font-weight:600;word-break:break-all}
.bill .sign{display:flex;justify-content:space-between;gap:16px;margin-top:24px;font-size:12.5px;color:var(--ink2)}
.bill .sign div{flex:1}
.bill .sign .line{border-bottom:1px solid var(--ink3);height:24px;margin-bottom:5px}
.bill .note{margin-top:12px;font-size:11.5px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:10px;white-space:pre-wrap}
.bigtotal{background:var(--brand-soft);border-radius:12px;padding:12px 14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bigtotal .k{font-size:13px;color:var(--brand-deep);font-weight:650}
.bigtotal .v{font-size:22px;font-weight:750;color:var(--brand-deep);font-variant-numeric:tabular-nums}
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(28,31,36,.95);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;padding:34px 16px;color:var(--ink3)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.55}
.empty p{margin:0 0 4px;font-size:13px}
.hero{background:linear-gradient(135deg,#0b6b5a,#12876f);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(11,107,90,.22)}
.hero .k{font-size:12px;opacity:.85}
.hero .v{font-size:30px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
.hero .split{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.hero .split div{flex:1}
.hero .split .n{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:11.5px;color:var(--ink3)}
.stat .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .u{font-size:11.5px;color:var(--ink3);font-weight:500;margin-left:2px}
.rank .rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.rank .rk:last-child{border-bottom:none}
.rank .rk .idx{width:22px;height:22px;border-radius:7px;background:#eef0f3;color:var(--ink2);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.rank .rk .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rk .track{height:5px;background:#eef0f3;border-radius:3px;overflow:hidden;margin-top:5px}
.rank .rk .track i{display:block;height:100%;background:linear-gradient(90deg,#0b6b5a,#12876f);border-radius:3px}
.rank .rk .val{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.rank .rk .val small{display:block;font-size:11px;color:var(--ink3);font-weight:500;margin-top:1px}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}.mask{align-items:center;padding:20px}.sheet{border-radius:20px;max-width:560px}.bill{padding:24px}}
html,body{overscroll-behavior:none;touch-action:manipulation}
.entry-table-scroll,.sheet{-webkit-overflow-scrolling:touch}
.custHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.custHead .nm{font-size:17px;font-weight:700}
.custHead .sub{font-size:11.5px;color:var(--ink3);background:#f2f4f7;padding:3px 9px;border-radius:999px;font-weight:600}
.custSum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.custSum .box{background:#f7f9f8;border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.custSum .box .k{font-size:10.5px;color:var(--ink3)}
.custSum .box .v{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:3px}
.custSum .box.paid{background:#e6f2ef;border-color:#b8ddd3}
.custSum .box.paid .k{color:#0b6b5a;font-weight:650}
.custSum .box.paid .v{color:#0b6b5a}
.custSum .box.paid input{width:100%;border:none;background:transparent;text-align:center;font-size:14px;font-weight:750;color:#0b6b5a;outline:none;font-variant-numeric:tabular-nums;padding:0;margin-top:3px}
.custSum .box.unpaid .v{color:#b3261e}
.settleRow{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-bottom:1px solid var(--line2)}
.settleRow:last-child{border-bottom:none}
.srHead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.srHead .plate{font-weight:700;color:var(--ink);font-size:13.5px}
.srHead .info{font-variant-numeric:tabular-nums}
.srHead .loss{color:#b3261e;font-weight:600}
.srBody{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;align-items:flex-end}
.srBody .miniLabel{font-size:10px;color:var(--ink3);margin-bottom:3px;display:block}
.srBody input{width:100%;min-height:34px;padding:4px 6px;border:1px solid var(--line);border-radius:9px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;background:#fff}
.srBody input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);outline:none}
.srBody input.unload{background:#fff8e1;border-color:#e5cd83}
.srBody input.final{background:#fdecea;border-color:#f7c8c2;color:#b3261e;font-weight:600}
.srBody input.paidIn{background:#e6f2ef;border-color:#b8ddd3;color:#0b6b5a;font-weight:600}
.srFoot{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;flex-wrap:wrap;gap:6px}
.srFoot .profit{font-weight:700;font-size:12px}
.srFoot .profit.pos{color:#0b6b5a}
.srFoot .profit.neg{color:#b3261e}
.ccList{display:flex;flex-direction:column;gap:8px}
.ccItem{display:flex;align-items:center;gap:8px;background:#f8f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ccItem:focus-within{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ccItem .ccNameLabel{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 0}
.ccItem .ccCostWrap{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 8px;flex:0 0 auto;min-height:34px}
.ccItem .ccCostWrap:focus-within{border-color:var(--brand)}
.ccItem .ccCostWrap .unit{font-size:11px;color:var(--ink3);font-weight:600;flex:none}
.ccItem .ccCost{width:56px;min-height:26px;padding:0;border:none;background:transparent;font-size:13.5px;font-weight:700;text-align:right;color:var(--brand-deep);outline:none;font-variant-numeric:tabular-nums}
.ccItem .ccCost::placeholder{color:#c8ced6;font-weight:500}
.ccEmpty{text-align:center;color:var(--ink3);font-size:12.5px;padding:20px 10px;background:#f8f9fb;border:1px dashed var(--line);border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brandMark">账</div>
    <div style="flex:1">
      <h1 id="shopTitle">销售流水</h1>
      <div class="sub" id="shopSub">开单 · 结算 · 对账</div>
    </div>
  </div>
  <section class="view on" id="view-entry"></section>
  <section class="view" id="view-settle"></section>
  <section class="view" id="view-detail"></section>
  <section class="view" id="view-bill"></section>
  <section class="view" id="view-stats"></section>
  <section class="view" id="view-settings"></section>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
var IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
var KEY='xs_v5';
var state={settings:null,records:[]};
function defaultSettings(){ return {shopName:'',phone:'',addr:'',billTitle:'对账单',billNote:'',money:'元',unit:'吨',costPrice:0,customerProfit:{}}; }
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var d=JSON.parse(raw); state.settings=Object.assign(defaultSettings(),d.settings||{}); state.records=Array.isArray(d.records)?d.records:[]; }
    else{ state.settings=defaultSettings(); }
    if(!state.settings.customerProfit) state.settings.customerProfit = {};
  }catch(e){ state.settings=defaultSettings(); state.records=[]; }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ toast('保存失败：存储空间不足'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function el(tag,cls,txt){ var n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; }
function add(p){ for(var i=1;i<arguments.length;i++){ if(arguments[i]!=null)p.appendChild(arguments[i]); } return p; }
function q(s,r){ return (r||document).querySelector(s); }
function qa(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function fmt(n,dec){ var d=(dec==null?2:dec); var s=(Math.round(num(n)*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); var parts=s.split('.'); parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return parts.join('.'); }
function fmtMoney(n){ return fmt(n,2); }
function fmtQty(n){ var v=num(n); return (Math.round(v*1000)/1000).toString(); }
function today(){ return dstr(new Date()); }
function dstr(d){ var m=d.getMonth()+1,day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0'+m:m)+'-'+(day<10?'0'+day:day); }
function addDays(ds,n){ var d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return dstr(d); }
function weekday(ds){ return '周'+'日一二三四五六'.charAt(new Date(ds+'T00:00:00').getDay()); }
function prettyDate(ds){ var t=today(); if(ds===t) return '今天'; if(ds===addDays(t,-1)) return '昨天'; return ds.slice(5).replace('-','/')+' '+weekday(ds); }
function toast(msg){ var t=q('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2000); }
function L(){ return state.settings; }
function showBackupText(text){
  var box=el('div','stack');
  box.appendChild(el('p','small muted','点下面按钮复制全部，然后粘贴到备忘录、微信文件传输助手或发给另一台手机。'));
  var ta=el('textarea','inp'); ta.value=text;
  ta.style.cssText='min-height:240px;font-size:11px;font-family:monospace;line-height:1.4;white-space:pre';
  ta.readOnly=true; box.appendChild(ta);
  var b=el('button','btn block','复制全部'); b.type='button';
  b.addEventListener('click',function(){
    ta.focus(); ta.select();
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){

function saveBillImage(opts){

    ctx.beginPath(); ctx.moveTo(PAD+signW+30, y+30); ctx.lineTo(W-PAD, y+30); ctx.stroke();
    ctx.fillText('经手人', PAD+signW+30, y+52);
    canvas.toBlob(function(blob){
      if(!blob){ toast('生成失败，请截图保存'); return; }
      var fname=(opts.title||'对账单')+'_'+(opts.customer||'客户')+'_'+today()+'.png';
      var file=null; try{ file=new File([blob], fname, {type:'image/png'}); }catch(e){}
      if(file && navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:fname}).then(function(){ toast('已分享'); }).catch(function(){ doDownload(blob, fname); });
      }else{ doDownload(blob, fname); }
    },'image/png');
    function doDownload(blob, fname){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=fname;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); },500);
      toast('图片已保存');
    }
  }catch(err){ toast('生成失败：'+err.message); console.error(err); }
}

var statRange='month';
function rangeOf(key){
  var t=today();
  if(key==='today') return {from:t,to:t,label:'今天'};
  if(key==='week'){ var d=new Date(t+'T00:00:00'); var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return {from:dstr(d),to:t,label:'本周'}; }
  if(key==='month') return {from:t.slice(0,8)+'01',to:t,label:'本月'};
  return {from:'',to:'',label:'全部'};
}

/* ========= 云同步 ========= */
var CLOUD_KEY='xs_cloud_v1';
function loadCloud(){ try{ return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}'); }catch(e){ return {}; } }
function saveCloudCfg(user,pass,file,proxy){ var c=loadCloud(); c.user=(user||'').trim(); c.pass=(pass||'').trim(); c.file=(file||'').trim()||'账本.json'; c.proxy=(proxy||'').trim(); try{ localStorage.setItem(CLOUD_KEY,JSON.stringify(c)); }catch(e){} }
function davAuth(u,p){ var s=u+':'+p; return 'Basic '+btoa(unescape(encodeURIComponent(s))); }
function davURL(c){ var base='https://dav.jianguoyun.com/dav/'; var file=encodeURIComponent(c.file||'账本.json'); var url=base+file; var proxy=c.proxy||''; if(!proxy) return url; if(proxy.indexOf('{url}')>=0) return proxy.replace('{url}',encodeURIComponent(url)); return proxy+encodeURIComponent(url); }
async function davGet(c){ var resp=await fetch(davURL(c),{method:'GET',headers:{'Authorization':davAuth(c.user,c.pass)}}); if(resp.status===404) return null; if(!resp.ok) throw new Error('下载失败 HTTP '+resp.status); return await resp.json(); }
async function davPut(c,data){ var resp=await fetch(davURL(c),{method:'PUT',headers:{'Authorization':davAuth(c.user,c.pass),'Content-Type':'application/json;charset=utf-8'},body:JSON.stringify(data)}); if(!resp.ok && resp.status!==201 && resp.status!==204) throw new Error('上传失败 HTTP '+resp.status); return true; }
function mergeState(local,remote){
  if(!remote||!Array.isArray(remote.records)) return {settings:local.settings,records:local.records};
  var map={}; (local.records||[]).forEach(function(r){ map[r.id]=r; });
  (remote.records||[]).forEach(function(r){ if(!map[r.id] || (r.ts||0)>(map[r.id].ts||0)) map[r.id]=r; });
  var merged=Object.keys(map).map(function(k){ return map[k]; });
  merged.sort(function(a,b){ return (a.date<b.date)?-1:(a.date>b.date?1:(a.ts||0)-(b.ts||0)); });
  return { settings: Object.assign({}, remote.settings||{}, local.settings||{}), records: merged };
}
